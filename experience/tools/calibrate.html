<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quad calibration</title>
<style>
  html,body { margin:0; background:#050b14; }
  #wrap { position:relative; display:inline-block; }
  img { display:block; }
  /* The mounted surface. A grid plus corner ticks: if the quad is right, the grid lines run
     parallel to the display's own edges and the ticks sit exactly on its corners. */
  .surface {
    position:absolute; left:0; top:0; transform-origin:0 0;
    background:
      repeating-linear-gradient(to right, rgba(0,255,200,.95) 0 2px, transparent 2px 10%),
      repeating-linear-gradient(to bottom, rgba(0,255,200,.95) 0 2px, transparent 2px 10%),
      rgba(255,0,120,.30);
    outline:3px solid rgba(255,255,0,.95); outline-offset:-3px;
  }
  .surface b { position:absolute; width:14px; height:14px; background:#fff; border:2px solid #f0f; }
  .surface b:nth-child(1){left:-7px;top:-7px} .surface b:nth-child(2){right:-7px;top:-7px}
  .surface b:nth-child(3){right:-7px;bottom:-7px} .surface b:nth-child(4){left:-7px;bottom:-7px}
</style>
</head>
<body>
<div id="wrap"><img id="plate" alt=""></div>
<script type="module">
// Solve the projective transform the same way js/screens.js does, so what you calibrate here is
// exactly what the experience will render.
function solve(src, dst) {
  const A = [], b = [];
  for (let i = 0; i < 4; i++) {
    const [x, y] = src[i], [u, v] = dst[i];
    A.push([x, y, 1, 0, 0, 0, -u * x, -u * y]); b.push(u);
    A.push([0, 0, 0, x, y, 1, -v * x, -v * y]); b.push(v);
  }
  const n = 8, M = A.map((r, i) => [...r, b[i]]);
  for (let c = 0; c < n; c++) {
    let p = c; for (let r = c + 1; r < n; r++) if (Math.abs(M[r][c]) > Math.abs(M[p][c])) p = r;
    [M[c], M[p]] = [M[p], M[c]];
    if (!M[c][c]) return null;
    for (let r = 0; r < n; r++) { if (r === c) continue; const f = M[r][c] / M[c][c];
      for (let k = c; k <= n; k++) M[r][k] -= f * M[c][k]; }
  }
  const h = M.map((r, i) => r[n] / r[i][i] !== undefined ? r[n] / M[i][i] : 0);
  return h;
}
function matrix3d(quad, w, h) {
  const src = [[0,0],[w,0],[w,h],[0,h]];
  const t = solve(src, quad);
  if (!t) return null;
  const [a,b_,c,d,e,f,g,i] = t;
  return `matrix3d(${a},${d},0,${g}, ${b_},${e},0,${i}, 0,0,1,0, ${c},${f},0,1)`;
}
const p = new URLSearchParams(location.search);
const img = document.getElementById('plate');
img.src = p.get('img');
img.onload = () => {
  const wrap = document.getElementById('wrap');
  const quads = JSON.parse(p.get('quads') || '[]');
  for (const q of quads) {
    const xs = q.map(pt => pt[0]), ys = q.map(pt => pt[1]);
    const w = Math.round((Math.hypot(q[1][0]-q[0][0], q[1][1]-q[0][1]) + Math.hypot(q[2][0]-q[3][0], q[2][1]-q[3][1])) / 2);
    const h = Math.round((Math.hypot(q[3][0]-q[0][0], q[3][1]-q[0][1]) + Math.hypot(q[2][0]-q[1][0], q[2][1]-q[1][1])) / 2);
    const el = document.createElement('div');
    el.className = 'surface';
    el.style.width = w + 'px'; el.style.height = h + 'px';
    el.style.transform = matrix3d(q, w, h);
    el.innerHTML = '<b></b><b></b><b></b><b></b>';
    wrap.appendChild(el);
  }
  document.title = 'ready';
};
</script>
</body>
</html>
